<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Pet Tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #FAF9F6;
    --bg-subtle: #F1EFE9;
    --ink: #24271F;
    --ink-body: #3D4038;
    --ink-muted: #5E6156;
    --ink-faint: #63665C;
    --ink-ghost: #6B6E64;
    --line: #DCD9CF;
    --line-soft: #E8E5DC;
    --green: #1F6F5C;
    --green-deep: #14503F;
    --green-tint: #E7F0EC;
    --on-green: #F7FBF9;
    --orange: #C4611E;
    --orange-tint: #FFF6EC;
    --orange-tint-line: #F0DCC4;
    --orange-deep: #A8641F;
    --orange-ink: #4A3A26;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--ink);
    font-family: "Instrument Sans", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .hidden { display: none; }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  a { color: var(--green); text-decoration: none; }

  #loadingState {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 22px;
  }
  .spinner {
    width: 26px; height: 26px;
    border: 3px solid var(--line-soft);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .setup-header { padding: 40px 22px 0; }
  .setup-header .eyebrow { margin-bottom: 10px; }
  .setup-header h1 {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    line-height: 1.2;
  }
  .setup-header p {
    font-size: 14.5px;
    line-height: 1.45;
    color: var(--ink-muted);
    margin: 8px 0 0;
  }

  form { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .field input {
    width: 100%;
    padding: 14px 15px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--bg-page);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
  }
  .field input::placeholder { color: var(--line); }
  .field input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .password-wrapper { position: relative; }
  .password-wrapper input { padding-right: 44px; }
  .toggle-password {
    position: absolute;
    top: 50%;
    right: 4px;
    transform: translateY(-50%);
    width: auto;
    margin: 0;
    padding: 8px;
    background: none;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-faint);
    cursor: pointer;
  }
  .toggle-password svg { display: block; }
  .toggle-password .icon-eye-off { display: none; }
  .toggle-password.is-visible .icon-eye { display: none; }
  .toggle-password.is-visible .icon-eye-off { display: block; }

  button { font-family: inherit; cursor: pointer; }
  .btn-dark {
    display: block;
    width: 100%;
    background: var(--ink);
    color: var(--bg-page);
    border: none;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
  }
  .btn-dark:active { background: #14150f; }
  .btn-dark:disabled { opacity: 0.6; }

  .error-text { font-size: 13.5px; color: var(--orange-deep); margin-top: 2px; min-height: 1.2em; }

  .tint-card { margin-top: 4px; padding: 14px 16px; border-radius: 16px; }
  .tint-card.green { background: var(--green-tint); color: var(--green-deep); }
  .tint-card.orange { background: var(--orange-tint); border: 1.5px solid var(--orange-tint-line); color: var(--orange-ink); }
  .tint-card p { font-size: 14px; line-height: 1.45; margin: 0; }

  .back-link { padding: 4px 22px 30px; text-align: center; font-size: 13.5px; }
  .back-link a { color: var(--ink-faint); }
  .back-link a:hover { color: var(--ink); }
</style>
</head>
<body>
  <div class="screen">

    <div id="loadingState">
      <div class="spinner"></div>
      <div class="eyebrow">Loading</div>
    </div>

    <div id="errorState" class="hidden">
      <div class="setup-header">
        <div class="eyebrow">Something went wrong</div>
        <h1 id="errorText">Couldn't load this tag right now.</h1>
      </div>
    </div>

    <div id="loginState" class="hidden">
      <div class="setup-header">
        <div class="eyebrow">Owner access</div>
        <h1>Manage this tag</h1>
        <p>Enter the password you created when you registered this tag.</p>
      </div>
      <form id="loginForm">
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" required>
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
              <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-dark" id="loginBtn">Log in</button>
        <div class="error-text" id="loginError"></div>
      </form>
      <div class="back-link"><a id="backLink1" href="#">Back to tag page</a></div>
    </div>

    <div id="editState" class="hidden">
      <div class="setup-header">
        <div class="eyebrow">Edit details</div>
        <h1>Edit tag details</h1>
        <p>These details are shown to whoever scans this tag.</p>
      </div>
      <form id="editForm">
        <div class="field">
          <label for="ownerPhone">Phone number</label>
          <input type="tel" id="ownerPhone" required>
        </div>
        <div class="field">
          <label for="ownerName">Your name (optional)</label>
          <input type="text" id="ownerName">
        </div>
        <div class="field">
          <label for="dogName">Pet's name (optional)</label>
          <input type="text" id="dogName">
        </div>
        <button type="submit" class="btn-dark" id="saveBtn">Save changes</button>
        <div class="error-text" id="editError"></div>
        <div class="tint-card green hidden" id="editSuccessCard"><p id="editSuccess"></p></div>
      </form>
      <div class="back-link"><a id="backLink2" href="#">Back to tag page</a></div>
    </div>

  </div>

<script>
  const API_BASE = "https://nfc-pet-finder-api.webbalfie49.workers.dev";

  const params = new URLSearchParams(window.location.search);
  const tagId = params.get("id");

  const states = {
    loading: document.getElementById("loadingState"),
    error: document.getElementById("errorState"),
    login: document.getElementById("loginState"),
    edit: document.getElementById("editState"),
  };
  const errorText = document.getElementById("errorText");
  const loginForm = document.getElementById("loginForm");
  const loginBtn = document.getElementById("loginBtn");
  const loginError = document.getElementById("loginError");
  const editForm = document.getElementById("editForm");
  const saveBtn = document.getElementById("saveBtn");
  const editError = document.getElementById("editError");
  const editSuccess = document.getElementById("editSuccess");
  const editSuccessCard = document.getElementById("editSuccessCard");
  const ownerPhoneInput = document.getElementById("ownerPhone");
  const ownerNameInput = document.getElementById("ownerName");
  const dogNameInput = document.getElementById("dogName");

  document.getElementById("backLink1").href = `index.html?id=${encodeURIComponent(tagId || "")}`;
  document.getElementById("backLink2").href = `index.html?id=${encodeURIComponent(tagId || "")}`;

  function show(state) {
    Object.values(states).forEach((el) => el.classList.add("hidden"));
    state.classList.remove("hidden");
  }

  function isValidTagId(id) {
    return typeof id === "string" && /^[A-Za-z0-9_-]{3,40}$/.test(id);
  }

  document.querySelectorAll(".toggle-password").forEach((btn) => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.classList.toggle("is-visible", !showing);
      btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    });
  });

  let sessionToken = null;

  if (!isValidTagId(tagId)) {
    show(states.error);
    errorText.textContent = "No valid tag ID was found in this link.";
  } else {
    show(states.login);
  }

  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    loginError.textContent = "";
    const password = document.getElementById("password").value;

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    fetch(`${API_BASE}/manage/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tagId, password }),
    })
      .then(async (res) => {
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || "Login failed");
        sessionToken = body.token;
        return fetch(`${API_BASE}/lookup?id=${encodeURIComponent(tagId)}`).then((r) => r.json());
      })
      .then((data) => {
        if (data.found) {
          ownerPhoneInput.value = data.ownerPhone || "";
          ownerNameInput.value = data.ownerName || "";
          dogNameInput.value = data.dogName || "";
        }
        show(states.edit);
      })
      .catch((err) => {
        loginBtn.disabled = false;
        loginBtn.textContent = "Log in";
        loginError.textContent = err.message || "Something went wrong. Please try again.";
      });
  });

  editForm.addEventListener("submit", (e) => {
    e.preventDefault();
    editError.textContent = "";
    editSuccessCard.classList.add("hidden");

    const ownerPhone = ownerPhoneInput.value.trim();
    const ownerName = ownerNameInput.value.trim();
    const dogName = dogNameInput.value.trim();

    if (!ownerPhone) {
      editError.textContent = "Phone number is required.";
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    fetch(`${API_BASE}/manage/update`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tagId, token: sessionToken, ownerPhone, ownerName, dogName }),
    })
      .then(async (res) => {
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || "Update failed");
        saveBtn.disabled = false;
        saveBtn.textContent = "Save changes";
        editSuccess.textContent = "Saved! The public tag page is now up to date.";
        editSuccessCard.classList.remove("hidden");
      })
      .catch((err) => {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save changes";
        editError.textContent = err.message || "Something went wrong. Please try again.";
        if (/session|log in/i.test(err.message || "")) {
          setTimeout(() => show(states.login), 1500);
        }
      });
  });
</script>
</body>
</html>
